[project]
name = "meeting-server"
version = "0.1.0"
description = "GPU transcription + diarization service (runs on the GPU box)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "transformers==4.57.1",
    "pyannote.audio==4.0.1",
    "torchcodec==0.7.0",
    "faster-whisper==1.2.1",
    "hydra-core",
    "omegaconf",
    "sentencepiece",
    "numpy",
    "fastapi",
    "uvicorn",
    "python-multipart",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
